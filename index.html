<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal da Cidade · Santa Maria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root{
  --roxo:#6A2C91; --roxo-esc:#4B1D68; --roxo-claro:#EEE6F5;
  --magenta:#C41E7A; --laranja:#F39200; --amarelo:#FFC700; --verde:#5AB55A; --azul:#1E88C7;
  --tinta:#2B2440; --tinta2:#6B6480; --linha:#E7E2EF; --fundo:#F6F4FA; --branco:#fff;
  --ok:#2E9E5B; --alerta:#E0A800; --ruim:#D8452F;
  --sombra:0 1px 3px rgba(43,36,64,.08),0 10px 30px rgba(43,36,64,.08);
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito Sans',system-ui,sans-serif;color:var(--tinta);background:var(--fundo);line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,.brandfont{font-family:'Fredoka',sans-serif;font-weight:600;line-height:1.15}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none}
img{display:block;max-width:100%}
.wrap{max-width:1120px;margin:0 auto;padding:0 22px}

.topbar{background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--linha);position:sticky;top:0;z-index:40}
.topbar .wrap{display:flex;align-items:center;gap:24px;height:66px}
.logo{height:38px}
.mainnav{display:flex;gap:6px;margin-left:auto;align-items:center}
.mainnav .link{padding:8px 15px;border-radius:999px;font-weight:700;color:var(--tinta2);font-size:14px;transition:.15s;display:flex;align-items:center;gap:6px}
.mainnav .link:hover{background:var(--fundo);color:var(--roxo)}
.mainnav .link.active{background:var(--roxo);color:#fff}
.mode-badge{font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--roxo-claro);color:var(--roxo)}

.subnav{background:var(--branco);border-bottom:1px solid var(--linha)}
.subnav .wrap{display:flex;gap:2px;overflow-x:auto}
.subnav button{padding:14px 15px;font-weight:700;font-size:13.5px;color:var(--tinta2);border-bottom:3px solid transparent;white-space:nowrap}
.subnav button.active{color:var(--roxo);border-bottom-color:var(--roxo)}
.subnav button:hover{color:var(--roxo)}

/* ===== HERO PORTAL ===== */
.hero{position:relative;min-height:560px;display:flex;align-items:center;color:#fff;overflow:hidden}
.hero .bg{position:absolute;inset:0;background-size:cover;background-position:center 65%}
.hero .ov{position:absolute;inset:0;background:linear-gradient(105deg,rgba(75,29,104,.94) 0%,rgba(106,44,145,.82) 42%,rgba(106,44,145,.25) 100%)}
.hero .inner{position:relative;padding:70px 0}
.hero .eyebrow{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);padding:7px 15px;border-radius:999px;font-weight:700;font-size:13.5px;margin-bottom:20px}
.hero h1{font-size:52px;max-width:720px;margin-bottom:16px;text-shadow:0 2px 20px rgba(0,0,0,.25)}
.hero p.sub{font-size:20px;max-width:600px;opacity:.96;margin-bottom:30px;line-height:1.5}
.btn{display:inline-flex;align-items:center;gap:10px;padding:16px 30px;border-radius:999px;font-weight:800;font-size:16.5px;transition:.15s}
.btn-primary{background:#fff;color:var(--roxo);box-shadow:0 8px 24px rgba(0,0,0,.18)}
.btn-primary:hover{transform:translateY(-2px)}
.btn-ghost{background:rgba(255,255,255,.14);color:#fff;border:1.5px solid rgba(255,255,255,.55)}
.btn-ghost:hover{background:rgba(255,255,255,.24)}
.btn-roxo{background:var(--roxo);color:#fff}
.btn-roxo:hover{background:var(--roxo-esc)}
.btn-lg{width:100%;justify-content:center}
.btn-out{border:1.5px solid var(--linha);color:var(--tinta);background:#fff;font-weight:700}
.btn-out:hover{border-color:var(--roxo);color:var(--roxo)}
.hero .stats{display:flex;gap:34px;margin-top:38px;flex-wrap:wrap}
.hero .stats .s b{font-family:'Fredoka';font-size:30px;font-weight:600;display:block}
.hero .stats .s span{font-size:13.5px;opacity:.85}

/* dialogue / convite */
.dialogue{padding:66px 0}
.dialogue-card{background:#fff;border-radius:24px;box-shadow:var(--sombra);overflow:hidden;display:grid;grid-template-columns:1.05fr .95fr}
.dialogue-card .txt{padding:46px 44px}
.dialogue-card .ph{background-size:cover;background-position:center;min-height:340px}
.dialogue .tag{color:var(--magenta);font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.dialogue h2{font-size:32px;margin:10px 0 16px}
.dialogue p{font-size:16.5px;color:var(--tinta2);margin-bottom:14px}
.dialogue .sign{margin-top:22px;font-weight:800;color:var(--roxo)}
.dialogue .sign span{display:block;font-weight:600;color:var(--tinta2);font-size:13.5px}

.section{padding:20px 0 70px}
.section h2.title{font-size:32px;text-align:center;margin-bottom:8px}
.section p.lead{text-align:center;color:var(--tinta2);font-size:17px;max-width:620px;margin:0 auto 34px}

/* agenda showcase cards */
.agrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:20px}
.acard{position:relative;border-radius:20px;overflow:hidden;min-height:250px;display:flex;align-items:flex-end;color:#fff;box-shadow:var(--sombra);cursor:pointer;transition:.2s}
.acard:hover{transform:translateY(-4px)}
.acard .bg{position:absolute;inset:0;background-size:cover;background-position:center;transition:.4s}
.acard:hover .bg{transform:scale(1.06)}
.acard .ov{position:absolute;inset:0;background:linear-gradient(0deg,rgba(43,36,64,.9) 0%,rgba(43,36,64,.15) 60%,rgba(43,36,64,0) 100%)}
.acard .c{position:relative;padding:20px}
.acard .em{font-size:30px;margin-bottom:6px}
.acard h3{font-size:21px;margin-bottom:3px}
.acard p{font-size:13px;opacity:.9}

.cta-band{background:linear-gradient(120deg,var(--roxo),var(--magenta));border-radius:24px;padding:44px;text-align:center;color:#fff;margin-top:12px}
.cta-band h2{font-size:30px;margin-bottom:10px}
.cta-band p{font-size:17px;opacity:.95;margin-bottom:24px;max-width:560px;margin-left:auto;margin-right:auto}

/* ===== AVALIAR / FORM ===== */
.flow{max-width:720px;margin:0 auto;padding:36px 0 70px}
.steps{display:flex;gap:8px;margin-bottom:26px;justify-content:center}
.steps .dot{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px;color:var(--tinta2)}
.steps .n{width:26px;height:26px;border-radius:50%;background:var(--linha);color:var(--tinta2);display:flex;align-items:center;justify-content:center;font-family:'Fredoka';font-size:14px}
.steps .dot.on .n{background:var(--roxo);color:#fff}
.steps .sep{width:26px;height:2px;background:var(--linha);align-self:center}
.card{background:#fff;border:1px solid var(--linha);border-radius:18px;padding:30px;box-shadow:var(--sombra)}
.card h2.h{font-size:26px;margin-bottom:6px}
.card p.help{color:var(--tinta2);font-size:15.5px;margin-bottom:22px}
label.fl{font-weight:800;font-size:13.5px;display:block;margin:16px 0 7px}
label.fl .req{color:var(--magenta)}
input,select,textarea{width:100%;font-family:inherit;font-size:16px;padding:13px 15px;border:1.5px solid var(--linha);border-radius:12px;color:var(--tinta);background:#fff}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--roxo);box-shadow:0 0 0 3px var(--roxo-claro)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.err{color:var(--ruim);font-size:12.5px;font-weight:700;margin-top:5px;display:none}
.err.show{display:block}

/* agenda rating block */
.rate{border:1px solid var(--linha);border-radius:18px;overflow:hidden;margin-bottom:20px;box-shadow:var(--sombra);background:#fff}
.rate .banner{position:relative;height:140px;color:#fff;display:flex;align-items:flex-end}
.rate .banner .bg{position:absolute;inset:0;background-size:cover;background-position:center}
.rate .banner .ov{position:absolute;inset:0;background:linear-gradient(0deg,rgba(43,36,64,.86),rgba(43,36,64,.15))}
.rate .banner .c{position:relative;padding:16px 20px}
.rate .banner .em{font-size:26px}
.rate .banner h3{font-size:20px}
.rate .body{padding:18px 20px 22px}
.rate .q{font-weight:700;font-size:15.5px;margin-bottom:14px}
.scale{display:flex;gap:6px;flex-wrap:wrap}
.scale button{flex:1;min-width:42px;height:50px;border-radius:11px;border:2px solid var(--linha);font-family:'Fredoka';font-weight:600;font-size:17px;color:var(--tinta);background:#fff;transition:.12s}
.scale button:hover{border-color:var(--roxo)}
.scale button.sel{color:#fff;transform:scale(1.05)}
.scale-legend{display:flex;justify-content:space-between;font-size:12.5px;color:var(--tinta2);font-weight:700;margin-top:9px}
.thanks{text-align:center;padding:50px 30px}
.thanks .big{font-size:70px}
.thanks h2{font-size:32px;margin:8px 0 10px}
.thanks p{font-size:17px;color:var(--tinta2);max-width:460px;margin:0 auto 8px}

/* ===== ADMIN ===== */
.section.view{padding:30px 0 60px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g5{grid-template-columns:repeat(5,1fr)}
@media(max-width:900px){.g3,.g4,.g5{grid-template-columns:repeat(2,1fr)}.dialogue-card{grid-template-columns:1fr}.dialogue-card .ph{min-height:220px}.hero h1{font-size:38px}.hero p.sub{font-size:17px}}
@media(max-width:560px){.g2,.g3,.g4,.g5,.frow{grid-template-columns:1fr}.hero h1{font-size:30px}.dialogue-card .txt{padding:30px 24px}}
.acard{min-height:230px}
.kpi{background:#fff;border:1px solid var(--linha);border-radius:var(--radius);padding:18px;box-shadow:var(--sombra)}
.kpi .lbl{font-size:13px;color:var(--tinta2);font-weight:700}
.kpi .num{font-family:'Fredoka';font-size:30px;font-weight:600;margin-top:2px}
.kpi .delta{font-size:12.5px;font-weight:800;margin-top:2px}
.up{color:var(--ok)}.down{color:var(--ruim)}.mid{color:var(--tinta2)}
.adcard{background:#fff;border:1px solid var(--linha);border-radius:var(--radius);padding:20px;box-shadow:var(--sombra)}
.sec-title{font-size:22px;margin:34px 0 4px}
.sec-sub{color:var(--tinta2);margin-bottom:18px;font-size:15px}
.npspill{display:inline-flex;align-items:center;justify-content:center;min-width:56px;padding:4px 10px;border-radius:999px;font-family:'Fredoka';font-weight:600;font-size:16px}
.nps-prom{background:#E4F6EA;color:#1E7A42}
.nps-neu{background:#FFF4D6;color:#9A7400}
.nps-det{background:#FCE7E2;color:#B23420}
.track{height:9px;border-radius:999px;background:var(--linha);overflow:hidden}
.track>span{display:block;height:100%;border-radius:999px}
.badge{display:inline-block;font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px}
.b-pos{background:#E4F6EA;color:#1E7A42}.b-neg{background:#FCE7E2;color:#B23420}.b-neu{background:var(--roxo-claro);color:var(--roxo)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:800;color:var(--tinta2);font-size:12px;text-transform:uppercase;letter-spacing:.03em;padding:10px 12px;border-bottom:1px solid var(--linha)}
td{padding:12px;border-bottom:1px solid var(--linha)}
tr:last-child td{border-bottom:none}
.pill-row{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:12.5px;font-weight:700;padding:5px 11px;border-radius:999px;background:var(--fundo);border:1px solid var(--linha);color:var(--tinta2)}
.swatch{height:64px;border-radius:12px;display:flex;align-items:flex-end;padding:8px;color:#fff;font-weight:700;font-size:12px;font-family:'Fredoka'}
.insight{border-left:4px solid var(--roxo);background:#fff;border-radius:0 12px 12px 0;padding:14px 18px;box-shadow:var(--sombra);margin-bottom:12px}
.insight.warn{border-left-color:var(--alerta)}.insight.bad{border-left-color:var(--ruim)}.insight.good{border-left-color:var(--ok)}
.insight h4{font-size:15px;margin-bottom:3px}.insight p{font-size:13.5px;color:var(--tinta2)}
.chartbox{position:relative;width:100%;height:300px}
.tag-canal{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;font-weight:700;color:var(--tinta2)}
.center{text-align:center}.mut{color:var(--tinta2)}

.foot{background:var(--roxo-esc);color:#fff;padding:34px 0;font-size:13.5px;margin-top:10px}
.foot .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:14px;align-items:center;opacity:.92}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(140px);background:var(--roxo);color:#fff;padding:15px 24px;border-radius:999px;font-weight:800;box-shadow:var(--sombra);transition:.3s;z-index:99;max-width:90%;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="topbar">
  <div class="wrap">
    <img class="logo" src="prototipo/assets/logo-sm-horizontal.png" alt="Prefeitura de Santa Maria">
    <nav class="mainnav">
      <a class="link active" id="lnk-publico" onclick="setMode('publico')">Portal da Cidade</a>
      <a class="link" id="lnk-admin" onclick="setMode('admin')">🔒 Administração</a>
    </nav>
  </div>
</div>

<div class="subnav" id="subnav" style="display:none"></div>

<main id="app"></main>

<footer class="foot">
  <div class="wrap">
    <div class="brandfont" style="font-size:16px">Portal da Cidade · Santa Maria — Inovar é Cuidar</div>
    <div>Prefeitura Municipal de Santa Maria · Ouvidoria Geral</div>
  </div>
</footer>

<div class="toast" id="toast"></div>

<script>
const IMG={
  hero:'prototipo/assets/city-eusm.jpg',
  catedral:'prototipo/assets/city-catedral.jpg',
  gare:'prototipo/assets/city-gare.jpg',
  feira:'prototipo/assets/city-feira.jpg',
  chafariz:'prototipo/assets/city-chafariz.jpg',
  lasader:'prototipo/assets/city-lasader.jpg'
};
const AGENDAS=[
  {id:'saude',nome:'Posto de saúde e UPA',icon:'🏥',cor:'#C41E7A',
   desc:'Atendimento no posto, UPA e farmácia',
   pergunta:'Quando você ou sua família precisa, o posto de saúde ou a UPA dão conta do atendimento?',
   ouvidoria:902,elogios:129,seed:{prom:260,neu:330,det:650}},
  {id:'lixo',nome:'Coleta de lixo',icon:'🗑️',cor:'#5AB55A',
   desc:'O lixo recolhido na sua rua',
   pergunta:'O caminhão do lixo passa certinho na sua rua?',
   ouvidoria:89,elogios:10,seed:{prom:380,neu:260,det:300}},
  {id:'agua',nome:'Água na torneira',icon:'💧',cor:'#1E88C7',
   desc:'Água sem faltar e com qualidade',
   pergunta:'A água chega na sua casa sem faltar e com qualidade?',
   ouvidoria:50,elogios:2,seed:{prom:300,neu:260,det:220}},
  {id:'onibus',nome:'Ônibus',icon:'🚌',cor:'#F39200',
   desc:'Transporte no seu dia a dia',
   pergunta:'Dá pra contar com o ônibus no seu dia a dia?',
   ouvidoria:46,elogios:2,seed:{prom:200,neu:240,det:420}},
  {id:'buracos',nome:'Buraco nas ruas',icon:'🕳️',cor:'#B5651D',
   desc:'Asfalto e conservação das vias',
   pergunta:'As ruas do seu bairro estão boas ou cheias de buraco?',
   ouvidoria:48,elogios:0,seed:{prom:150,neu:220,det:520}},
  {id:'calcadas',nome:'Calçadas pra caminhar',icon:'🚶',cor:'#0E9E8E',
   desc:'Calçadas seguras para o pedestre',
   pergunta:'Dá pra andar com segurança pelas calçadas do seu bairro?',
   ouvidoria:7,elogios:0,seed:{prom:180,neu:250,det:430}},
  {id:'iluminacao',nome:'Iluminação à noite',icon:'💡',cor:'#E0A100',
   desc:'Postes e luz nas ruas',
   pergunta:'À noite, a sua rua é bem iluminada?',
   ouvidoria:21,elogios:6,seed:{prom:300,neu:240,det:220}},
  {id:'pracas',nome:'Praças e parques',icon:'🌳',cor:'#3B8C3B',
   desc:'Espaços de lazer perto de você',
   pergunta:'As praças e parques perto de você são bons pra levar a família?',
   ouvidoria:17,elogios:12,seed:{prom:330,neu:210,det:150}},
  {id:'arvores',nome:'Árvores no bairro',icon:'🌱',cor:'#7CB342',
   desc:'Arborização e sombra nas ruas',
   pergunta:'Seu bairro tem árvore e sombra suficiente?',
   ouvidoria:14,elogios:20,seed:{prom:360,neu:210,det:140}}
];

/* ===== conexão com o banco (Neon via API) =====
   AO VIVO quando servido por http(s) (rodando pelo servidor).
   DEMO quando o arquivo é aberto direto (usa dados locais no navegador). */
let LIVEMODE = (typeof location!=='undefined') && (location.protocol==='http:'||location.protocol==='https:');
let NPSCACHE={geral:null,pautas:{}};
let OUVCACHE=null;
let BAIRROCACHE=[];
let PARTCACHE=[];
let AUTH=(()=>{try{return sessionStorage.getItem('admin_token');}catch(e){return null;}})();
function setAuth(t){AUTH=t;try{t?sessionStorage.setItem('admin_token',t):sessionStorage.removeItem('admin_token');}catch(e){}}
function authHeaders(extra){return Object.assign({},extra||{},AUTH?{'Authorization':'Bearer '+AUTH}:{});}
function applyNps(nps){ if(nps){ NPSCACHE.geral=nps.geral||null; NPSCACHE.pautas=nps.pautas||{}; } }
async function apiGET(p){const r=await fetch('/api'+p);if(!r.ok)throw new Error(r.status);return r.json();}
async function boot(){
  if(LIVEMODE){
    try{
      const d=await apiGET('/bootstrap');
      if(Array.isArray(d.pautas)&&d.pautas.length){
        d.pautas.forEach(p=>{const a=AGENDAS.find(x=>x.id===p.id);
          if(a){a.nome=p.nome;a.desc=p.descricao||a.desc;a.pergunta=p.pergunta||a.pergunta;a.cor=p.cor||a.cor;a.icon=p.icone||a.icon;a.imagem=p.imagem||null;}
          else AGENDAS.push({id:p.id,nome:p.nome,icon:p.icone||'📌',cor:p.cor||'#6A2C91',desc:p.descricao||'',pergunta:p.pergunta,ouvidoria:0,elogios:0,imagem:p.imagem||null});
        });
      }
    }catch(e){ console.warn('API indisponível — modo demonstração.', e); LIVEMODE=false; }
  }
  render();
}
async function carregarAdmin(){
  try{
    const r=await fetch('/api/admin',{headers:authHeaders()});
    if(r.status===401){ setAuth(null); VIEW='login'; render(); toast('Sessão expirada. Entre novamente.'); return; }
    if(!r.ok) throw new Error('erro');
    const d=await r.json();
    applyNps(d.nps); OUVCACHE=d.ouvidoria; BAIRROCACHE=d.bairros||[]; PARTCACHE=d.participantes||[];
    if(Array.isArray(d.pautas)) d.pautas.forEach(p=>{const a=AGENDAS.find(x=>x.id===p.id);if(a)a.imagem=(p.imagem!==undefined?p.imagem:a.imagem);});
    VIEW='dash'; render();
  }catch(e){ toast('Não foi possível carregar o painel.'); }
}
function vLogin(){
  return `<div class="wrap"><div class="flow"><div class="card" style="max-width:420px;margin:30px auto">
    <div style="font-size:34px;text-align:center">🔒</div>
    <h2 class="h" style="text-align:center">Administração</h2>
    <p class="help" style="text-align:center">Área restrita à gestão. Entre com seu usuário e senha.</p>
    <label class="fl">Usuário</label>
    <input id="lg-user" autocomplete="username" onkeydown="if(event.key==='Enter')fazerLogin()">
    <label class="fl">Senha</label>
    <input id="lg-pass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')fazerLogin()">
    <button class="btn btn-roxo btn-lg" style="margin-top:22px" onclick="fazerLogin()">Entrar</button>
    <p class="center" style="font-size:13px;margin-top:14px"><a onclick="setMode('publico')" style="cursor:pointer;color:var(--roxo);font-weight:700">← Voltar ao portal</a></p>
  </div></div></div>`;
}
function fazerLogin(){
  const u=(document.getElementById('lg-user')||{}).value||'', s=(document.getElementById('lg-pass')||{}).value||'';
  if(!u||!s){toast('Preencha usuário e senha.');return;}
  fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({usuario:u,senha:s})})
    .then(r=>r.ok?r.json():Promise.reject(r))
    .then(d=>{setAuth(d.token);toast('Bem-vindo(a)!');carregarAdmin();})

/* imagens das pautas — editáveis via admin (persistidas localmente no protótipo) */
let IMGS={};
function loadImgs(){try{const s=localStorage.getItem('pautas_img_sm');if(s)IMGS=JSON.parse(s);}catch(e){}}
function saveImgs(){try{localStorage.setItem('pautas_img_sm',JSON.stringify(IMGS));}catch(e){toast('Imagem muito grande para o armazenamento local.');}}
function pautaImg(id){
  if(typeof LIVEMODE!=='undefined' && LIVEMODE){const a=AGENDAS.find(x=>x.id===id);return (a&&a.imagem)||null;}
  return IMGS[id]||null;
}
loadImgs();
function handleUpload(id,input){
  const f=input.files&&input.files[0];if(!f)return;
  if(!f.type.startsWith('image/')){toast('Selecione um arquivo de imagem.');return;}
  const r=new FileReader();
  r.onload=e=>{const img=new Image();img.onload=()=>{
    const max=1000;let w=img.width,h=img.height;
    if(w>max){h=Math.round(h*max/w);w=max;}
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;
    cv.getContext('2d').drawImage(img,0,0,w,h);
    let durl;try{durl=cv.toDataURL('image/jpeg',0.82);}catch(err){toast('Não foi possível processar a imagem.');return;}
    if(LIVEMODE){
      fetch('/api/pauta-imagem',{method:'POST',headers:authHeaders({'Content-Type':'application/json'}),body:JSON.stringify({id:id,imagem:durl})})
        .then(rp=>{if(!rp.ok)throw new Error('erro');return rp.json();})
        .then(d=>{const a=AGENDAS.find(x=>x.id===id);if(a)a.imagem=d.imagem;toast('Imagem da pauta atualizada!');render();})
        .catch(()=>toast('Falha no upload.'));
    }else{IMGS[id]=durl;saveImgs();toast('Imagem da pauta atualizada!');render();}
  };img.src=e.target.result;};
  r.readAsDataURL(f);
}
function removeImg(id){
  if(LIVEMODE){fetch('/api/pauta-imagem',{method:'POST',headers:authHeaders({'Content-Type':'application/json'}),body:JSON.stringify({id:id,imagem:null})}).then(()=>{const a=AGENDAS.find(x=>x.id===id);if(a)a.imagem=null;toast('Imagem removida.');render();}).catch(()=>toast('Falha ao remover.'));return;}
  delete IMGS[id];saveImgs();toast('Imagem removida.');render();
}
function npsOf(id){
  if(LIVEMODE){return NPSCACHE.pautas[id]||{nps:0,total:0,prom:0,neu:0,det:0};}
  const v=VOTES[id];const t=v.prom+v.neu+v.det;if(!t)return{nps:0,total:0,prom:0,neu:0,det:0};
  return{nps:Math.round((v.prom-v.det)/t*100),total:t,prom:Math.round(v.prom/t*100),neu:Math.round(v.neu/t*100),det:Math.round(v.det/t*100)};}
function npsGlobal(){
  if(LIVEMODE){return NPSCACHE.geral||{nps:0,total:0,prom:0,det:0};}
  let p=0,n=0,d=0;AGENDAS.forEach(a=>{p+=VOTES[a.id].prom;n+=VOTES[a.id].neu;d+=VOTES[a.id].det;});const t=p+n+d;
  return{nps:Math.round((p-d)/t*100),total:t,prom:Math.round(p/t*100),det:Math.round(d/t*100)};}
function npsClass(n){return n>=0?(n>=30?'nps-prom':'nps-neu'):'nps-det';}
function npsColor(n){return n>=30?'#2E9E5B':n>=0?'#E0A800':'#D8452F';}
function notaColor(i){return i<=6?'#D8452F':i<=8?'#E0A800':'#2E9E5B';}

      <div style="position:absolute;left:12px;bottom:9px;color:#fff;font-weight:800;font-size:14px">${a.icon} ${a.nome}</div>
      ${im?'':'<div style="position:absolute;right:10px;top:8px;background:rgba(255,255,255,.85);color:var(--tinta2);font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px">sem foto</div>'}
    </div>
    <div style="padding:12px;display:flex;gap:8px">
      <input type="file" id="up-${a.id}" accept="image/*" style="display:none" onchange="handleUpload('${a.id}',this)">

    </div>

}

function mascaraCPF(c){c=String(c||'').replace(/\D/g,'');if(c.length!==11)return c||'—';return c.slice(0,3)+'.***.***-'+c.slice(9);}
function fmtData(s){if(!s)return '—';try{const d=new Date(s);return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});}catch(e){return '—';}}

function vBairros(){
  const demo=[{bairro:'Centro',nps:14,total:132},{bairro:'Camobi',nps:-6,total:98},{bairro:'Nossa Senhora Medianeira',nps:-19,total:74},{bairro:'Patronato',nps:8,total:53},{bairro:'Tancredo Neves',nps:-27,total:41}];
  const lista=(LIVEMODE?BAIRROCACHE:demo).filter(b=>b.total>0).sort((a,b)=>a.nps-b.nps);
  const rows=lista.length?lista.map(b=>`<tr><td><b>${b.bairro}</b></td><td><span class="npspill ${npsClass(b.nps)}">${b.nps>0?'+':''}${b.nps}</span></td><td>${(b.total||0).toLocaleString('pt-BR')}</td><td style="min-width:130px">${track(50+(b.nps||0)/2,npsColor(b.nps))}</td></tr>`).join('')
    :`<tr><td colspan="4" class="mut" style="text-align:center;padding:26px">Ainda não há avaliações suficientes por bairro.</td></tr>`;
  return `<div class="wrap"><section class="section view">
    <h2 class="sec-title" style="margin-top:0">Percepção por bairro</h2><p class="sec-sub">Onde a cidade está mais satisfeita e onde precisa de atenção. Do menor para o maior NPS.</p>
    ${LIVEMODE?'':'<p class="mut" style="font-size:12.5px;margin:-8px 0 14px">Exemplo ilustrativo — no ar, mostra os bairros reais.</p>'}
    <div class="adcard" style="padding:0;overflow:hidden"><table>
      <thead><tr><th>Bairro</th><th>NPS</th><th>Avaliações</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table></div>
  </section></div>`;
}
function vParticipantes(){
  const demo=[{nome:'Ana Souza',cpf:'12345678909',celular:'55999990001',bairro:'Camobi',votos:9,ultimo:new Date().toISOString(),media:6.4},{nome:'Carlos Lima',cpf:'98765432100',celular:'55999990002',bairro:'Centro',votos:5,ultimo:new Date().toISOString(),media:7.8}];
  const lista=LIVEMODE?PARTCACHE:demo;
  const rows=lista.length?lista.map(p=>`<tr><td><b>${p.nome||'—'}</b></td><td class="mut">${mascaraCPF(p.cpf)}</td><td>${p.bairro||'—'}</td><td style="text-align:center">${p.votos||0}</td><td style="text-align:center">${p.media!=null?Number(p.media).toFixed(1):'—'}</td><td class="mut" style="font-size:12.5px">${fmtData(p.ultimo)}</td></tr>`).join('')
    :`<tr><td colspan="6" class="mut" style="text-align:center;padding:26px">As pessoas que avaliarem aparecerão aqui.</td></tr>`;
  return `<div class="wrap"><section class="section view">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
      <div><h2 class="sec-title" style="margin-top:0">Quem avaliou</h2><p class="sec-sub" style="margin-bottom:0">Relatório dos cidadãos que participaram. CPF parcialmente oculto por privacidade.</p></div>
      <button class="btn-out" style="padding:9px 16px;border-radius:10px;font-size:14px" onclick="exportarParticipantes()">⬇️ Exportar CSV</button>
    </div>
    ${LIVEMODE?'':'<p class="mut" style="font-size:12.5px;margin:8px 0 0">Exemplo ilustrativo — no ar, mostra os participantes reais.</p>'}
    <div class="adcard" style="padding:0;overflow:hidden;margin-top:16px"><table>
      <thead><tr><th>Nome</th><th>CPF</th><th>Bairro</th><th style="text-align:center">Pautas</th><th style="text-align:center">Média</th><th>Última avaliação</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <p class="mut" style="font-size:12.5px;margin-top:10px">${lista.length} participante(s).</p>
  </section></div>`;
}
function exportarParticipantes(){
  const lista=LIVEMODE?PARTCACHE:[];
  if(!lista.length){toast('Sem participantes reais para exportar (modo demonstração).');return;}
  const head=['Nome','CPF','Celular','Bairro','Pautas avaliadas','Média','Última avaliação'];
  const linhas=lista.map(p=>[p.nome||'',String(p.cpf||''),String(p.celular||''),p.bairro||'',p.votos||0,p.media!=null?Number(p.media).toFixed(1):'',p.ultimo||'']);
  const csv=[head].concat(linhas).map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\n');
  const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='participantes-nps.csv';a.click();URL.revokeObjectURL(url);
  toast('CSV gerado.');
}
const VIEWS={portal:vPortal,avaliar:vAvaliar,login:vLogin,dash:vDash,nps:vNps,bairros:vBairros,participantes:vParticipantes,ouvidoria:vOuvidoria,leitura:vLeitura,conteudo:vConteudo,identidade:vIdentidade};

function drawCharts(){const grid='#E7E2EF',tick='#8A83A0';
  if(VIEW==='nps'&&document.getElementById('chAg')){
    charts.push(new Chart(chAg,{type:'bar',data:{labels:AGENDAS.map(a=>a.nome),datasets:[{data:AGENDAS.map(a=>npsOf(a.id).nps),backgroundColor:AGENDAS.map(a=>a.cor),borderRadius:6,barThickness:26}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{min:-60,max:60,grid:{color:grid},ticks:{color:tick}},y:{grid:{display:false},ticks:{color:'#52514e',font:{size:12}}}}}}));
  }

    charts.push(new Chart(chTipo,{type:'doughnut',data:{labels:['Reclamação 75,3%','Elogio 18,6%','Sugestão 4,9%','Denúncia 1,2%'],datasets:[{data:[75.3,18.6,4.9,1.2],backgroundColor:['#D8452F','#5AB55A','#F39200','#6A2C91'],borderWidth:2,borderColor:'#fff'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{color:'#52514e',font:{size:12},padding:12}}},cutout:'62%'}}));
    charts.push(new Chart(chSec,{type:'bar',data:{labels:['Saúde','Serv. Públicos','Educação','Mobilidade','Meio Amb.','Licenciam.','Habitação','Fazenda'],datasets:[{data:[902,344,216,198,93,92,83,82],backgroundColor:'#6A2C91',borderRadius:5,barThickness:18}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{color:grid},ticks:{color:tick}},y:{grid:{display:false},ticks:{color:'#52514e',font:{size:11.5}}}}}}));
  }
  if(VIEW==='dash'){
    charts.push(new Chart(chCruz,{data:{labels:AGENDAS.map(a=>a.nome),datasets:[{type:'bar',label:'Manifestações',data:AGENDAS.map(a=>a.ouvidoria),backgroundColor:'#C9BCE0',borderRadius:5,yAxisID:'y',barThickness:30,order:2},{type:'line',label:'NPS',data:AGENDAS.map(a=>npsOf(a.id).nps),borderColor:'#6A2C91',backgroundColor:'#6A2C91',borderWidth:3,tension:.3,pointRadius:5,yAxisID:'y1',order:1}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{color:'#52514e',font:{size:12}}}},scales:{y:{position:'left',grid:{color:grid},ticks:{color:tick}},y1:{position:'right',min:-60,max:60,grid:{display:false},ticks:{color:'#6A2C91'}},x:{grid:{display:false},ticks:{color:'#52514e',font:{size:11}}}}}}));
    charts.push(new Chart(chEvo,{type:'bar',data:{labels:['2024','2025'],datasets:[{label:'Respondidas',data:[2299,2810],backgroundColor:'#5AB55A',borderRadius:5,barThickness:56},{label:'Em atendimento',data:[42,45],backgroundColor:'#F39200',borderRadius:5,barThickness:56}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{color:'#52514e',font:{size:12}}}},scales:{x:{stacked:true,grid:{display:false},ticks:{color:'#52514e'}},y:{stacked:true,grid:{color:grid},ticks:{color:tick}}}}}));
  }
}
boot();
</script>
